name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-o3qppznt7ivederf.cn-guangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: crpi-o3qppznt7ivederf.cn-guangzhou.personal.cr.aliyuncs.com/giluoo/blinko
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Aliyun ACR rejects the OCI provenance/SBOM attestation manifests buildx
          # adds by default ("unknown manifest class for application/vnd.oci.empty.v1+json"),
          # so disable them and push a plain Docker image.
          provenance: false
          sbom: false
          # Reuse layers across runs via the GitHub Actions cache. Unchanged base/
          # dependency layers keep the same digest, so ACR already has them and the
          # cross-border push only uploads the layer that actually changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
